function hash(x,y,k=0){let a=Math.imul(x|0,0x1f1f1f1f)^Math.imul(y|0,0x65d200cf)^Math.imul(k|0,0x27d4eb2d)^g.seed;a=Math.imul(a^(a>>>16),0x7feb352d);a=Math.imul(a^(a>>>15),0x846ca68b);return ((a^(a>>>16))>>>0)/4294967296}

const SCAN_RANGE_M=10,SCAN_CONE=Math.cos(Math.PI/5);
let scanTrace=null;
function scanContacts(){
 const range=worldUnits(SCAN_RANGE_M);
 let fresh=null,known=null,bestFresh=Infinity,bestKnown=Infinity;
 const targets=[...localLife,...localSites.filter(o=>o.kind==='cargo').map(o=>({cargo:o,x:o.x,y:o.y-4,radius:4}))];
 for(const e of targets){
  if(!e.cargo&&(!e.species||e.hp<=0||dead.has(e.id)))continue;
  const dx=e.x-g.x,dy=e.y-g.y,d=Math.hypot(dx,dy);
  if(d>range+1e-8||d<.01||(dx*aim.x+dy*aim.y)/d<SCAN_CONE)continue;
  let clear=true;
  for(let step=1;step<d;step+=2){
   if(solid(Math.floor((g.x+dx*step/d)/TILE),Math.floor((g.y+dy*step/d)/TILE))){clear=false;break}
  }
  if(!clear)continue;
  if(e.cargo?g.fieldLog[e.cargo.id]:g.surveyed.includes(e.species.name)){if(d<bestKnown){known=e;bestKnown=d}}
  else if(d<bestFresh){fresh=e;bestFresh=d}
 }
 return {fresh,known};
}
function scanCreature(){
 if(modal||transition)return;
 const {fresh:e,known}=scanContacts();
 if(!e){toast(known?(known.cargo?'沈没貨物は解析済みです':'前方の生物は登録済みです'):'前方'+SCAN_RANGE_M+' m以内にスキャン対象がいません');return}
 if(e.cargo){scanTrace={x:e.x,y:e.y,sector:g.sector,until:g.clock+.65};recoverPlan(e.cargo);return}
 g.surveyed.push(e.species.name);peak('survey',g.surveyed.length);specimenIndex=e.species.index;
 scanTrace={x:e.x,y:e.y,sector:g.sector,until:g.clock+.65};
 sound(680,.20,'sine',.05,1280);
 notice('生物図鑑に登録：'+e.species.name);save();refreshHud();
}

const frames=new Map();
const TAU_FISH=2*Math.PI;
function frameFor(d,frame,alert){
 const canvas=document.createElement('canvas');
 canvas.width=d.width+12;canvas.height=d.height+14;
 const c=canvas.getContext('2d');
 const [body,highlight,pattern,fin]=d.colors;
 const wave=TAU_FISH*frame/10, pulse=Math.sin(wave);
 const color={b:body,h:highlight,p:pattern,f:fin,s:body,d:'#202c3a',e:'#182332',w:'#fff0ce',t:highlight,
  g:pulse>.05?'#b6ffe4':'#66adb0'};
 const gPixels=[];
 const garden=d.mode==='garden', horse=d.mode==='horse', reed=d.mode==='reed', vertical=d.mode==='vertical';
 const faceModes=['bite','fang','gulp','pear','lure'];
 const puffer=d.mode==='puff';
 const size=puffer?1+alert*.13:1;
 const cx=d.width*.53,cy=d.height*.5;
 const pale=['silver','school','dart','hatchet'];
 for(const [x,y,ink] of d.pixels){
  const back=Math.max(0,1-x/(d.width*.66));
  let xx=x,yy=y;
  if(garden){
   const above=1-y/d.height;
   xx+=Math.sin(wave+y*.1)*above*2.1;
   yy=d.height-(d.height-y)*(1-alert*.24);
  }else if(horse||vertical){
   xx+=Math.sin(wave+y/d.height*2)*(horse?(y<d.height*.55?.55:.95):1.4);
   if(ink==='f')xx+=pulse*1.1;
  }else{
   let amp=d.mode==='dart'||d.mode==='ribbon'?2.1:reed?.9:1.55;
   yy+=Math.sin(wave-x*.1)*amp*back;
   if(ink==='f')yy+=pulse*(y>cy?.85:-.85);
   if(faceModes.includes(d.mode)&&x>d.width*.72&&y>cy+.6)yy+=Math.max(0,pulse)*(d.mode==='bite'?2:1.5);
   if(d.mode==='lure'&&y<4)xx+=pulse*(4-y)*.39;
   if(d.mode==='walk'&&y>d.height-3)xx+=Math.sin(wave+x*.7)*1.3;
   if(d.mode==='pennant'&&y<4)xx+=Math.sin(wave)*.55*(4-y);
   if(d.mode==='box'&&x<cx*.6)xx+=pulse*.83;
   if(d.mode==='rock')yy+=Math.sin(wave)*((x-cx)/d.width);
  }
  let tone=color[ink];
  if(ink==='h'&&pale.includes(d.mode)&&Math.abs(x/d.width-frame/10)<.14)tone='#ebf6e8';
  if(ink==='g'&&d.mode==='beacon')tone=Math.sin(wave+x*.38)>.1?'#ddffd4':'#619698';
  if(d.mode==='dome'&&ink==='p')tone=pulse>.55?'#88e89b':pattern;
  if(d.mode==='tube'&&ink==='e')xx+=pulse>.7?1:0;
  const u=Math.round(6+cx+(xx-cx)*size),v=Math.round(7+cy+(yy-cy)*size);
  gPixels.push([u,v,tone,ink]);
 }
 // Contrasting outlines stay legible over both coral and dark cave water.
 c.fillStyle='#203845';
 for(const [x,y,,ink] of gPixels){
  if(ink==='t')continue;
  c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3);
 }
 for(const [x,y,tone,ink] of gPixels){
  c.fillStyle=tone;c.globalAlpha=ink==='t'?.42:1;
  c.fillRect(x,y,size>1.1?2:1,size>1.1?2:1);
  if(ink==='s'){c.fillStyle='rgba(22,40,56,.46)';c.fillRect(x,y,1,1)}
 }
 c.globalAlpha=1;
 if(puffer&&alert>0){
  for(let i=0;i<12;i++){
   const a=i*TAU_FISH/12;

 function tentacle(c,x,y,length,t,offset,amplitude,col){
  let px=x,py=y;
  for(let j=2;j<=length;j+=2){
   const nx=x+sin(t+offset-j*.33)*amplitude*j/length,ny=y+j;
   line(c,px,py,nx,ny,col);px=nx;py=ny;
  }
 }

 function paintJelly(c,s,t,react,variant){
  let [id,col,rim,dark,hz]=s.art;
  const time=t*hz,p=sin(time),w=round(p),osc=round(p*1.5);
  if(id==='color'){
   [col,rim,dark]=[['#92abda','#dde7ff','#7272ab'],['#d39ebc','#ffe1d8','#976c9c'],['#a0c5ad','#e0f1c4','#73a490'],['#d5ae84','#ffdfb7','#ac877e']][Math.min(3,Math.floor(variant*4))];
  }
  if(['bluebutton','sail','warship'].includes(id)){
   if(id==='bluebutton'){
    for(let i=0;i<14;i++){const a=i/14*tau,xx=cos(a)*(8+sin(time+i)*1.5),yy=sin(a)*(4+cos(time+i));line(c,cos(a)*4,sin(a)*2,xx,yy,dark);dot(c,xx,yy,col)}
    oval(c,0,0,5,2,col);oval(c,0,0,3,1,rim);dot(c,-1,0,'#9d915e',3);
   }else if(id==='sail'){
    for(let i=-4;i<=4;i+=2)tentacle(c,i,1,3+(i+4)%3,time,i,1.5,dark);
    oval(c,0,0,7,2,col);
    poly(c,[[-5,-1],[-2,-2],[3+w,-7],[4+w,-3],[4,-1]],'#a6cbd6');
    chain(c,[[-5,-1],[3+w,-7],[4,-1]],rim);line(c,-5,1,4,1,dark);
   }else{
    for(let i=0;i<5;i++)tentacle(c,-4+i*1.6,0,7+(i*3)%8,time,i,2,dark);
    oval(c,0,-1,7,2,col);poly(c,[[-6,-2],[-4,-4],[-2,-3],[0,-6+w],[1,-5],[3,-6+w],[6,-2]],col);
    chain(c,[[-5,-3],[-3,-4],[-2,-3],[0,-6+w],[2,-4],[3,-6+w],[6,-2]],rim);line(c,-4,0,4,0,'#7188dd');
   }
   return;
  }
  if(['melon','helmet','globe','ribbon'].includes(id)){
   if(id==='ribbon'){
    for(let x=-12;x<=12;x++){const y=round(sin(time-x*.29)*2);dot(c,x,y,col,1,2);dot(c,x,y+2,dark);if((x+12)%2===0)dot(c,x,y-1,rainbow[(Math.floor(time*3)+(x+12)/2)%7])}

    if(id==='globe'){for(const side of [-1,1])tentacle(c,side*3,2,9,time,side,3,dark)}

   const x=(i/(num-1)*2-1)*(rx-1),length=len-((i*3)%4);

   }else{

    if(id==='ghost'&&i>1&&i<4){for(let j=2;j<8;j+=2)dot(c,x+sin(time-j*.33)*j*.23,j,rim,2)}
   }

  const alpha=c.globalAlpha;c.globalAlpha*=id==='crown'||id==='spotted'?1:.73;

  }else for(let j=0;j<=h;j++){

   dot(c,-span,y0-j,col,span*2+1);
  }

  line(c,-rx,y0,rx,y0,id==='rim'?col:rim);
  line(c,-1,-h-1,1,-h-1,rim);
  if(id==='moon'){
   for(const [x,y] of [[-2,-3],[1,-3],[-2,-1],[1,-1]]){line(c,x,y,x+1,y-1,dark);dot(c,x+2,y,dark)}

  }else if(id==='spotted'){

  }else if(id==='color'){
   chain(c,[[-rx+1,-2],[-3,-4],[-1,-4]],rim);dot(c,1,2,rim,2);

  const radius=worldUnits(100+50*hash(band,0,1961));
  const x=Math.round((radius+(WORLD_W-radius*2)*hash(band,0,1962))/8)*8;
  const center=Math.round((worldUnits(200)+wreckBand*(band+.39+.22*hash(band,0,1963)))/8)*8;
  if(center+radius<WORLD_H){
   ship={id:'ship@'+band,x,y:center,radius,items:[],enemies:[]};
   const at=(dx,dy,kind,i)=>({id:ship.id+'/'+kind+i,kind,x:x+dx,y:center+dy,tx:Math.floor((x+dx)/8),ty:Math.floor((center+dy)/8),ship:ship.id});
   for(let i=0;i<3;i++){ship.items.push(at(-120+i*106,40,'chest',i),at(-92+i*104,40,'cargo',i))}
   for(let i=0;i<2+Number(hash(band,0,1964)<.5);i++){

    ship.enemies.push({...e,species:shipSpecies,variant:i,radius:6,face:1,hp:64,atk:19,type:'angler',homeX:e.x,homeY:e.y,bite:i*.4,stun:0,hit:0,alert:0,phase:i});

// Before removing a rock tile, identify bounded water pockets on its far side.

function inspectDrillOpening(cell){
 if(g.journal.won['sealed/1'])return;
 const px=Math.floor(g.x/TILE),py=Math.floor(g.y/TILE),from=tileKey(px,py);
 const checked=new Set(),pending=g.journal.timers;
 for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
  const x=cell.x+dx,y=cell.y+dy,id=tileKey(x,y);
  if(solid(x,y)||checked.has(id)||Math.abs(px-x)+Math.abs(py-y)<2)continue;
  const cells=[id],visited=new Set([id]);let bounded=true;
  for(let i=0;i<cells.length&&bounded;i++){
   const here=cells[i],tx=here%NX,ty=Math.floor(here/NX);
   if(here===from||ty<2||cells.length>1800){bounded=false;break}
   for(const [ax,ay] of [[tx+1,ty],[tx-1,ty],[tx,ty+1],[tx,ty-1]]){
    if(ax<0||ax>=NX||ay<0||ay>=NY||solid(ax,ay))continue;
    const next=tileKey(ax,ay);
    if(!visited.has(next)){visited.add(next);cells.push(next)}
   }
  }
  for(const k of visited)checked.add(k);
  if(bounded&&cells.length>=4){
   pending.pockets??=[];
   if(!pending.pockets.some(p=>p.includes(id)))pending.pockets.push(cells);
  }
 }
}

}

function manual(){return '<div class="helpList"><p><b>操艦</b>　WASD・矢印キー、または画面左のスティックで移動。スティックの傾きで速さを調節できます。Shift・スペースまたはブーストボタンで、移動方向に急加速します（電力'+BOOST_POWER+'）。</p><p><b>採取</b>　鉱床・生物採取ポイント・水素結晶に近づき、Eまたは採取ボタンを押すと、採取を開始します。完了時に電力'+HARVEST_POWER+'を消費して素材を回収します。途中で離れた場合や、完了時に電力が足りない場合は再挑戦できます。採取済みの地点はその海域では復活しません。</p><p><b>最初の強化</b>　近くの鉱床でチタンと銅を集めます。基本製作でチタン10個をインゴッドにし、外殻強化で銅5個と組み合わせます。</p><p><b>水圧</b>　最初の圧壊深度は100 mです。圧壊深度を超えると、深く潜るほど毎秒の耐久度損失が大きくなります。現在の損失は潜航モニターに表示されます。外殻1段階につき100 m延長できます。修理キットは積載庫で使用します。</p><p><b>発電・燃料</b>　通常移動は実際に進んだ1 mにつき電力'+MOVE_POWER_PER_METER+'を消費します。高効率燃料変換を装備すると消費は10%減ります。通常のソーラー発電は100 mまで8/秒で、200 mで止まります。150 m以深の水素結晶を採取すると燃料が補充され、不足時は5秒ごとに重水素1個で80、または水素1個で50回復します。</p><p><b>装備</b>　Q・Cにアクティブ2基、常時作動するパッシブ3基を装備できます。ドリルはボタンを押している間作動します。強化ベンチを製作すると各地で改型へ強化できます。</p><p><b>生物スキャン</b>　艇を生物に向け、前方'+SCAN_RANGE_M+' m以内でFキーまたはスキャンボタンを押します。登録した種の生息深度や動きは航海端末の「生物図鑑」で確認できます。製作・強化はBキーです。</p><p><b>沈没貨物</b>　前方の貨物ユニットをスキャンすると設計図を1枚取得します。アクティブは5枚、パッシブは3枚で製作解放。設計図が重複するたびに1ポイント獲得。5ポイントで未完成のアクティブモジュールの設計図をランダムに1枚取得します。アクティブをすべて解放すると未解放のパッシブ設計図を、防護フィルターを含む全モジュールを解放すると拡張外殻ユニットを得ます。1段階で圧壊深度が100 m増加します。防護フィルターは汚染地帯を発見すると解放されます。パルス発生装置と電磁防御は最初から製作できます。</p><p><b>深海拠点と信号</b>　深度300 m以深の拠点には沈没貨物が1〜2基あります。左のチャンバーに接近してEまたは操作ボタンで物資を回収します。右の整備ステーションはドッキングで全回復できる一回限りの設備です。沈没端末に電力50を供給すると整備ビーコンが起動します。航海端末の「信号管理」で色と表示を選べます。</p><p><b>生物との遭遇</b>　敵性生物は深度'+HOSTILE_MIN_DEPTH_M+' m以深に生息します。静穏な通路とバイオームでは敵性生物に遭遇しません。</p><p><b>海域移動</b>　深度0〜100 mで航海端末を開き、別の海域の水面へ移動できます。</p><p><b>航行復旧</b>　電力切れでは水面に緊急浮上します。耐久度が尽きると物資を一部失い、出発地点で復旧します。</p><p><b>航海記録</b>　プレイ時間5分ごとに同じブラウザへ自動保存します。採取やスキャンの完了時、メニューを開いた時にも保存します。各端末メニューを開くと航行は一時停止します。</p></div>'}
